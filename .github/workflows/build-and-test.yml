name: Docker Build and Test

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  build-and-test-ubuntu-docker-image:
    name: Build and Test
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Checkout
      # https://github.com/marketplace/actions/checkout

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Docker Buildx
      # https://github.com/marketplace/actions/docker-setup-buildx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # Docker Login
      # https://github.com/marketplace/actions/docker-login

      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and Test Docker images
      # https://github.com/marketplace/actions/build-and-push-docker-images

      - name: Build Ubuntu Docker Image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ubuntu
          tags: |
            ghcr.io/osinfra-io/ubuntu:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test Ubuntu Docker Image
        run: |
          docker run --rm ghcr.io/osinfra-io/ubuntu:test zsh --version
          docker run --rm ghcr.io/osinfra-io/ubuntu:test gcloud --version
          docker run --rm ghcr.io/osinfra-io/ubuntu:test brew --version
          docker run --rm ghcr.io/osinfra-io/ubuntu:test copilot --version
          docker run --rm ghcr.io/osinfra-io/ubuntu:test tofu --version
          docker run --rm ghcr.io/osinfra-io/ubuntu:test helm version
          docker run --rm ghcr.io/osinfra-io/ubuntu:test kubectl version --client
          docker run --rm ghcr.io/osinfra-io/ubuntu:test gh --version
