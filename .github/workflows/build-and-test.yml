name: Docker Build and Test

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  build-and-test-ubuntu-docker-image:
    name: Build and Test
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Checkout
      # https://github.com/marketplace/actions/checkout

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Docker Buildx
      # https://github.com/marketplace/actions/docker-setup-buildx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Docker Login
      # https://github.com/marketplace/actions/docker-login

      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and Test Docker images
      # https://github.com/marketplace/actions/build-and-push-docker-images

      - name: Build Ubuntu Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ubuntu
          tags: |
            ghcr.io/osinfra-io/ubuntu:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test Ubuntu Docker Image
        run: |
          docker run --rm ghcr.io/osinfra-io/ubuntu:test zsh --version
          docker run --rm ghcr.io/osinfra-io/ubuntu:test gcloud --version
          docker run --rm ghcr.io/osinfra-io/ubuntu:test brew --version
          docker run --rm ghcr.io/osinfra-io/ubuntu:test copilot --version
          docker run --rm ghcr.io/osinfra-io/ubuntu:test tofu --version
          docker run --rm ghcr.io/osinfra-io/ubuntu:test helm version
          docker run --rm ghcr.io/osinfra-io/ubuntu:test kubectl version --client
          docker run --rm ghcr.io/osinfra-io/ubuntu:test gh --version
