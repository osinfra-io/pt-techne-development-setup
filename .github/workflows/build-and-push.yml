name: Docker Build and Push

on:
  release:
    types: [ published ]

permissions:
  actions: write
  attestations: write
  contents: read
  id-token: write
  packages: write

jobs:
  build-and-push-ubuntu-docker-image:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ github.event.release.tag_name }}

    steps:
      # Checkout
      # https://github.com/marketplace/actions/checkout

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Docker Buildx
      # https://github.com/marketplace/actions/docker-setup-buildx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      # Docker Login
      # https://github.com/marketplace/actions/docker-login

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and Push Docker to GitHub Container Registry
      # https://github.com/marketplace/actions/build-and-push-docker-images

      - name: Build and Push Ubuntu to GitHub Container Registry
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ubuntu
          tags: |
            ghcr.io/osinfra-io/ubuntu:${{ env.VERSION }}
            ghcr.io/osinfra-io/ubuntu:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          push: true
