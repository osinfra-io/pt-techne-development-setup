name: Docker Build and Push

on:
  release:
    types: [published]

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  build-and-push-ubuntu-docker-image:
    name: Build and Push
    if: github.event.sender.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.release.tag_name }}

    steps:
      # Checkout
      # https://github.com/marketplace/actions/checkout

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Docker Buildx
      # https://github.com/marketplace/actions/docker-setup-buildx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      # Docker Login
      # https://github.com/marketplace/actions/docker-login

      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and Push Docker to GitHub Container Registry
      # https://github.com/marketplace/actions/build-and-push-docker-images

      - name: Build and Push Ubuntu to GitHub Container Registry
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: ubuntu
          tags: |
            ghcr.io/osinfra-io/ubuntu:${{ env.VERSION }}
            ghcr.io/osinfra-io/ubuntu:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
